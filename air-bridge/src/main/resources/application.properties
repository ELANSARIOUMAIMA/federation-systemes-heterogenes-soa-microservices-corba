spring.application.name=air-bridge
server.port=8080
# Dans Docker : http://air:8080/ws ; en local (hors Docker) : http://localhost:8081/ws
air.soap.url=${AIR_SOAP_URL:http://localhost:8081/ws}

# --- P3 : résilience ---
# Timeouts HTTP du client SOAP (absents en P1). Budget hold/confirm : 2 s + 3 s = 5 s < 6 s côté booking-service.
air.soap.connect-timeout-ms=${AIR_SOAP_CONNECT_TIMEOUT_MS:2000}
air.soap.read-timeout-ms=${AIR_SOAP_READ_TIMEOUT_MS:3000}
air.circuit-breaker.window-size=6
air.circuit-breaker.minimum-calls=3
air.circuit-breaker.failure-rate=50
air.circuit-breaker.open-seconds=15
air.retry.wait-ms=200

# --- P3 : logs corrélés (trace_id / span_id injectés dans le MDC par l'agent OpenTelemetry) ---
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]

# --- P3 : Actuator (santé et état du circuit breaker) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

