server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway
gateway.rail-url=${RAIL_URL:http://localhost:8082}
gateway.air-url=${AIR_URL:http://localhost:8083}
gateway.car-url=${CAR_URL:http://localhost:8084}
gateway.booking-url=${BOOKING_URL:http://localhost:8086}
gateway.auth.username=${GATEWAY_USERNAME:}
gateway.auth.password=${GATEWAY_PASSWORD:}

# --- P3 : résilience sur la recherche multimodale ---
gateway.search.timeout-ms=3500
gateway.circuit-breaker.window-size=6
gateway.circuit-breaker.minimum-calls=3
gateway.circuit-breaker.failure-rate=50
gateway.circuit-breaker.open-seconds=15
gateway.retry.wait-ms=150

# --- P3 : logs corrélés et Actuator ---
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
