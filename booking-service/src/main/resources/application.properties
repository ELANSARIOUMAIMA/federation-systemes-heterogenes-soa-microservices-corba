server.port=${SERVER_PORT:8080}
spring.application.name=booking-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/booking;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
booking.rail-url=${RAIL_URL:http://localhost:8082}
booking.air-url=${AIR_URL:http://localhost:8083}
booking.car-url=${CAR_URL:http://localhost:8084}
booking.pricing-url=${PRICING_URL:http://localhost:8085}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
booking.compensation.max-attempts=${COMPENSATION_MAX_ATTEMPTS:20}
booking.outbox.scan-ms=${OUTBOX_SCAN_MS:2000}
