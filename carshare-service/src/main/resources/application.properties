
server.port=${SERVER_PORT:8080}
spring.application.name=carshare-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/carshare;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
spring.task.scheduling.pool.size=1

# --- P3 : logs corrélés (MDC OpenTelemetry) et Actuator ---
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]
management.endpoints.web.exposure.include=health,info

