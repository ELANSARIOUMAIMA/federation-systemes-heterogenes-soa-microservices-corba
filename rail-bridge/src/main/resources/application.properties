spring.application.name=rail-bridge
server.port=8080
# Fichier IOR publié par l'opérateur ferroviaire. Docker : /ior/RailBooking.ior
rail.ior.path=${RAIL_IOR_PATH:ior/RailBooking.ior}

# --- P3 : résilience ---
# Timeouts JacORB + jacorb.retries=0 (sinon JacORB effectue 5 retries internes = ~14 s par appel !).
# Budget d'un search (2 tentatives) : 2 x 1 s = 2 s < 3,5 s côté api-gateway.
# Budget d'un hold/confirm (1 tentative) : 1 s + 2,5 s = 3,5 s < 6 s côté booking-service.
rail.corba.connect-timeout-ms=${RAIL_CORBA_CONNECT_TIMEOUT_MS:1000}
rail.corba.reply-timeout-ms=${RAIL_CORBA_REPLY_TIMEOUT_MS:2500}
rail.corba.orb-retries=${RAIL_CORBA_ORB_RETRIES:0}
# Circuit breaker autour des appels IIOP (pannes techniques uniquement, jamais NotAvailable).
rail.circuit-breaker.window-size=6
rail.circuit-breaker.minimum-calls=3
rail.circuit-breaker.failure-rate=50
rail.circuit-breaker.open-seconds=15

# --- P3 : logs corrélés (trace_id / span_id injectés dans le MDC par l'agent OpenTelemetry) ---
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]

# --- P3 : Actuator (santé et état du circuit breaker) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

